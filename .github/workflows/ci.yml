name: Check client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_public_tree.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python tests/check_account_parse.py
      - run: python tests/check_accounts_bulk.py
      - run: python tests/check_config_cache.py
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npm run build:app
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: interface-${{ matrix.os }}
          path: ui/
