name: Build desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux native toolkit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libgirepository-2.0-dev libcairo2-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1
          python -m pip install PyGObject
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m nuitka --version
      - run: python tools/check_public_tree.py
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python build.py
      - name: Check packaged Windows client
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Get-ChildItem build -Directory -Recurse | Where-Object Name -Like 'Nimbus v*' | Select-Object -First 1
          node tools/smoke_windows.mjs "$($package.FullName)" smoke-results
      - name: Save native window evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-window-check
          path: smoke-results/
      - uses: actions/upload-artifact@v4
        with:
          name: nimbus-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
